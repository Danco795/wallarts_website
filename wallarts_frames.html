<style>
:root{--bg:#f4f1ec;--fg:#1a1a1a;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--fg:#f2f2f2;--card:#222}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 12px;z-index:5;border-bottom:1px solid #8884}
h1{font-size:17px;margin:0 0 8px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
button{border:1px solid #8888;background:var(--card);color:var(--fg);padding:8px 12px;border-radius:8px;font-size:14px}
button.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
#info{font-size:13px;opacity:.75}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:14px;align-items:end}
.cell{display:flex;flex-direction:column;align-items:center;background:var(--card);padding:12px 8px;border-radius:10px}
.frame{width:var(--w);aspect-ratio:1/1.4142;padding:calc(var(--w)*.045);background:var(--fc);box-shadow:0 6px 14px #0006;box-sizing:border-box}
.mat{width:100%;height:100%;background:#fff;padding:calc(var(--w)*.07);box-sizing:border-box;box-shadow:inset 0 0 4px #0005}
.mat img{width:100%;height:100%;object-fit:cover;display:block}
.cap{font-size:12px;margin-top:8px;opacity:.7}
