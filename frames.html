<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ec">
  <title>WallArts Frame Size Slideshow A0–A5</title>
  <style>
    :root{--bg:#f4f1ec;--fg:#1a1a1a;--card:#fff;--deep:#1f2d28;--muted:#626b67;--gold:#c7a477;--frame:#c7a477}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    header{position:sticky;top:0;z-index:5;padding:12px 16px;background:#f4f1ecf2;border-bottom:1px solid #0002;backdrop-filter:blur(10px)}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.back{color:var(--deep);font-size:13px;font-weight:700;text-decoration:none}h1{margin:0 0 9px;font-size:clamp(18px,3vw,26px)}
    .controls{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:8px 0}.controls-label{width:100%;margin-top:3px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    button{min-height:36px;padding:7px 12px;border:1px solid #8e969188;border-radius:7px;background:var(--card);color:var(--fg);font-size:12px;font-weight:650;cursor:pointer}
    button.selected{border-color:var(--deep);background:var(--deep);color:#fff}button:focus-visible{outline:3px solid #c8933c88;outline-offset:2px}
    #info{margin-top:8px;color:var(--muted);font-size:12px}.stage{min-height:410px;display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:12px;padding:28px 16px 16px}
    .arrow{width:44px;height:44px;border-radius:50%;font-size:21px}.slide{display:grid;justify-items:center;gap:16px;min-width:0}.frame-wrap{display:grid;place-items:center;width:min(100%,520px);height:clamp(320px,57vh,620px);overflow:hidden}
    .frame{height:min(100%,560px);aspect-ratio:1/1.4142;padding:var(--frame-padding,16px);background:var(--frame);box-shadow:0 16px 35px #0003;transition:width .35s,height .35s,padding .25s,background .2s}
    .mat{width:100%;height:100%;padding:clamp(8px,2vw,20px);background:#fff;box-shadow:inset 0 0 4px #0004}.mat img{display:block;width:100%;height:100%;object-fit:cover;background:#eee}
    .caption{text-align:center}.caption strong{display:block;font:600 26px Georgia,serif}.caption span{color:var(--muted);font-size:12px}.slide-controls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:0 16px 28px}.slide-controls button{min-width:92px}
    .thumbs{display:flex;justify-content:center;gap:8px;overflow-x:auto;padding:0 16px 22px}.thumb{width:62px;height:62px;flex:0 0 auto;padding:3px;border:2px solid transparent;border-radius:6px;overflow:hidden}.thumb.selected{border-color:var(--gold);background:var(--card)}.thumb img{width:100%;height:100%;object-fit:cover}
    @media(max-width:520px){header{padding:10px}.stage{grid-template-columns:38px minmax(0,1fr) 38px;gap:5px;padding:20px 7px 12px;min-height:360px}.arrow{width:36px;height:36px}.frame-wrap{height:clamp(300px,52vh,500px)}.frame{padding:var(--frame-padding,12px)}.slide-controls button{min-width:80px;padding-inline:8px}}
  </style>
</head>
<body>
  <header>
    <div class="topline"><h1>WallArts · Frame size slideshow</h1><a class="back" href="/index.html#sizes">← Back to WallArts</a></div>
    <div class="controls" id="sizes"><span class="controls-label">Choose a size</span></div>
    <div class="controls" id="finishes"><span class="controls-label">Choose a frame finish</span></div>
    <div id="info" aria-live="polite"></div>
  </header>
  <main>
    <section class="stage" aria-label="Artwork size preview">
      <button class="arrow" type="button" id="previous" aria-label="Previous artwork">‹</button>
      <div class="slide">
        <div class="frame-wrap"><div class="frame" id="frame"><div class="mat"><img id="artwork" src="bedroom-wall.png" alt="Bedroom wall art shown in an A5 frame"></div></div></div>
        <div class="caption"><strong id="size-title">A5</strong><span id="art-title">Bedroom wall art · Oak frame</span></div>
      </div>
      <button class="arrow" type="button" id="next" aria-label="Next artwork">›</button>
    </section>
    <div class="slide-controls"><button id="play" type="button" aria-pressed="false">▶ Play slideshow</button><button id="pause" type="button">Ⅱ Pause</button></div>
    <nav class="thumbs" id="thumbnails" aria-label="Choose artwork"></nav>
  </main>
  <script>
    const artworks = [
      { src: "bedroom-wall.png", title: "Bedroom wall art" },
      { src: "family-wall-art.jpg", title: "Family wall art" },
      { src: "japan-canvas.png", title: "Japanese landscape canvas" },
      { src: "canvas-set.jpg", title: "Canvas set" },
      { src: "football-1.jpg", title: "Football art" },
      { src: "football-2.jpg", title: "Football collage" },
      { src: "quote-1.jpg", title: "Motivational wall art" },
      { src: "watercolor-family.jpg", title: "Watercolor family portrait" },
      { src: "portrait-2.jpg", title: "Portrait artwork" }
    ];
    const sizes = [
      { label: "A5", width: 140, padding: 8 }, { label: "A4", width: 170, padding: 10 },
      { label: "A3", width: 220, padding: 12 }, { label: "A2", width: 270, padding: 15 },
      { label: "A1", width: 330, padding: 18 }, { label: "A0", width: 390, padding: 22 }
    ];
    const finishes = [
      { label: "Oak", color: "#c7a477" }, { label: "Walnut", color: "#8b5e3c" },
      { label: "Black", color: "#212121" }, { label: "White", color: "#f4f1ec" }
    ];
    let artworkIndex = 0, sizeIndex = 0, finishIndex = 0, timer = null;
    const $ = (id) => document.getElementById(id);
    const sizeButtons = [], finishButtons = [];

    function update() {
      const art = artworks[artworkIndex], size = sizes[sizeIndex], finish = finishes[finishIndex];
      const frame = $("frame"), image = $("artwork");
      image.src = art.src;
      image.alt = art.title + " shown in an " + size.label + " " + finish.label + " frame";
      frame.style.width = "min(" + size.width + "px, 100%)";
      frame.style.setProperty("--frame-padding", size.padding + "px");
      frame.style.setProperty("--frame", finish.color);
      $("size-title").textContent = size.label;
      $("art-title").textContent = art.title + " · " + finish.label + " frame";
      $("info").textContent = size.label + " portrait proportion · " + finish.label + " finish · Artwork " + (artworkIndex + 1) + " of " + artworks.length;
      sizeButtons.forEach((button, index) => button.classList.toggle("selected", index === sizeIndex));
      finishButtons.forEach((button, index) => button.classList.toggle("selected", index === finishIndex));
      document.querySelectorAll(".thumb").forEach((button, index) => button.classList.toggle("selected", index === artworkIndex));
    }

    sizes.forEach((size, index) => {
      const button = document.createElement("button");
      button.type = "button"; button.textContent = size.label;
      button.setAttribute("aria-label", "Preview " + size.label + " frame size");
      button.addEventListener("click", () => { sizeIndex = index; update(); });
      sizeButtons.push(button); $("sizes").appendChild(button);
    });
    finishes.forEach((finish, index) => {
      const button = document.createElement("button");
      button.type = "button"; button.textContent = finish.label;
      button.addEventListener("click", () => { finishIndex = index; update(); });
      finishButtons.push(button); $("finishes").appendChild(button);
    });
    artworks.forEach((art, index) => {
      const button = document.createElement("button");
      button.type = "button"; button.className = "thumb"; button.setAttribute("aria-label", "Show " + art.title);
      const thumb = document.createElement("img"); thumb.src = art.src; thumb.alt = ""; thumb.loading = "lazy";
      button.appendChild(thumb); button.addEventListener("click", () => { artworkIndex = index; update(); });
      $("thumbnails").appendChild(button);
    });
    function step(direction) { artworkIndex = (artworkIndex + direction + artworks.length) % artworks.length; update(); }
    $("previous").addEventListener("click", () => step(-1));
    $("next").addEventListener("click", () => step(1));
    $("play").addEventListener("click", () => {
      if (timer) return;
      timer = window.setInterval(() => step(1), 3000);
      $("play").setAttribute("aria-pressed", "true");
    });
    $("pause").addEventListener("click", () => {
      window.clearInterval(timer); timer = null;
      $("play").setAttribute("aria-pressed", "false");
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") step(-1);
      if (event.key === "ArrowRight") step(1);
      if (event.key === "Escape") { window.clearInterval(timer); timer = null; }
    });
    update();
  </script>
</body>
</html>
